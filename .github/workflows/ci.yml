name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # CI 不签名（ADR-0004）
      - name: Build app
        run: |
          xcodebuild build \
            -project Notes.xcodeproj \
            -scheme Notes \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 打进 bundle 的资源和 Info.plist 键：单元测试看不到，这里直接检查构建出来的 app
      - name: Check bundled resources
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name Notes.app -path '*Build/Products/Debug/*' | head -1)
          echo "App: $APP"
          test -n "$APP"
          test -s "$APP/Contents/Resources/Readability.js"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent' "$APP/Contents/Info.plist")" = "true"

      - name: Test NotesCore
        timeout-minutes: 15
        run: swift test --package-path Packages/NotesCore
