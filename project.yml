# XcodeGen 工程描述。生成：`xcodegen generate`。生成的 Notes.xcodeproj 不提交。
name: Notes

options:
  bundleIdPrefix: com.linem7
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  NotesCore:
    path: Packages/NotesCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "3.1.0"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"

targets:
  Notes:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "**/.gitkeep"
    # 字典类型的 Info.plist 键没法用 INFOPLIST_KEY_*，由 XcodeGen 生成 App/Info.plist（不提交），再和生成的键合并
    info:
      path: App/Info.plist
      properties:
        # 网页抓取（WKWebView）要能打开 http:// 链接；只放开网页内容，app 自己的请求仍受 ATS 限制。
        # 抓取用非持久 data store，也没有 JS 桥（ARCHITECTURE §6）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linem7.Notes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Notes
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # 本机用固定的自签名证书签名（ADR-0004），创建步骤见 README。CI 不签名。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Notes Self-Signed
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: NotesCore
      - package: KeyboardShortcuts
      - package: MarkdownUI
    scheme: {}
